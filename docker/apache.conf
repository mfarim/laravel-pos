<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Hardening PHP2Shell (issue #11): matikan session upload progress secara
    # administratif sehingga tidak bisa di-override lewat .htaccess / ini_set().
    # Direkomendasikan advisory PHP untuk CVE-2026-109619 dan CVE-2026-115560.
    php_admin_flag session.upload_progress.enabled off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
